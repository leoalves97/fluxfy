version: '3.8'

services:
  api:
    build: .
    container_name: fluxfy_backend
    expose:
      - "8000"
    env_file:
      - .env
    restart: always

  caddy:
    image: caddy:2-alpine
    container_name: fluxfy_proxy
    restart: always
    read_only: true
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
