<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluxfy - Gerenciamento de Usuários</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/icon/icon.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        fluxfy: {
                            yellow: '#F5C71A',
                            dark: '#D4A810',
                            black: '#111111'
                        }
                    }
                }
            }
        }
    </script>
    
    <link rel="stylesheet" href="style.css">
    <script src="theme.js" defer></script>
    <script src="aprovacoes.js" defer></script>
    <script src="sidebar-loader.js" defer></script>
</head>
<body class="admin-body bg-gray-50 dark:bg-gray-900 transition-colors duration-300 text-gray-800 dark:text-gray-200">
    
    <!-- Sidebar (Menu Lateral) -->
    <div id="sidebar-container" class="w-64 flex-shrink-0"></div>

    <!-- Área de Conteúdo Principal -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        <!-- Header -->
        <header class="h-16 bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between px-6 transition-colors duration-300">
            <h1 class="text-xl font-bold text-gray-800 dark:text-white">Gerenciamento de Usuários</h1>
            <div class="flex items-center gap-4">
                <button id="theme-toggle" type="button" class="text-gray-500 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-gray-700 rounded-lg text-sm p-2.5 transition-colors">
                    <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
                    <svg id="theme-toggle-light-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path></svg>
                </button>
            </div>
        </header>

        <!-- Conteúdo Rolável -->
        <div class="flex-1 overflow-y-auto p-6">
            
            <!-- Cards de Resumo / Filtros Interativos -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div id="cardFiltroTodos" onclick="filtrar('todos')" class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-sm border-2 border-transparent hover:border-fluxfy-yellow cursor-pointer transition-all">
                    <p class="text-sm font-medium text-gray-500 dark:text-gray-400">Total de Usuários</p>
                    <p class="text-2xl font-bold text-gray-900 dark:text-white mt-2" id="contadorTotal">-</p>
                </div>
                <div id="cardFiltroPendentes" onclick="filtrar('pendentes')" class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-sm border-2 border-transparent hover:border-fluxfy-yellow cursor-pointer transition-all">
                    <p class="text-sm font-medium text-gray-500 dark:text-gray-400">Pendentes de Aprovação</p>
                    <p class="text-2xl font-bold text-fluxfy-dark dark:text-fluxfy-yellow mt-2" id="contadorPendentes">-</p>
                </div>
                <div id="cardFiltroAprovados" onclick="filtrar('aprovados')" class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-sm border-2 border-transparent hover:border-fluxfy-yellow cursor-pointer transition-all">
                    <p class="text-sm font-medium text-gray-500 dark:text-gray-400">Usuários Aprovados</p>
                    <p class="text-2xl font-bold text-green-600 dark:text-green-400 mt-2" id="contadorAprovados">-</p>
                </div>
            </div>

            <!-- Tabela de Usuários -->
            <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 overflow-hidden">
                <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center">
                    <h2 class="text-lg font-semibold text-gray-800 dark:text-white" id="tituloTabela">Lista de Usuários (Todos)</h2>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-50 dark:bg-gray-900/50 text-gray-500 dark:text-gray-400 text-sm">
                                <th class="px-6 py-3 font-medium">Nome</th>
                                <th class="px-6 py-3 font-medium">E-mail</th>
                                <th class="px-6 py-3 font-medium">Status / Papel</th>
                                <th class="px-6 py-3 font-medium">Data da Solicitação</th>
                                <th class="px-6 py-3 font-medium text-right">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaUsuarios" class="divide-y divide-gray-200 dark:divide-gray-700">
                            <tr>
                                <td colspan="5" class="px-6 py-8 text-center text-gray-500 dark:text-gray-400">
                                    Carregando usuários...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>
</body>
</html>
