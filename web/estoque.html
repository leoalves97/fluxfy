<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluxfy - Gerenciamento de Estoque</title>
    <link rel="icon" type="image/png" href="assets/icon/icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { fluxfy: { yellow: '#F5C71A', dark: '#D4A810', black: '#111111' } } } }
        }
    </script>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
    <script>
        window.onload = function() {
            if(typeof AuthConfig !== 'undefined') AuthConfig.protegerRota(['admin', 'operador']);
        };
    </script>
    <script src="estoque.js" defer></script>
    <script src="chatbot.js" defer></script>
    <script src="sidebar-loader.js" defer></script>
    <script src="header-loader.js" defer></script>
</head>
<body class="admin-body bg-gray-50 dark:bg-gray-900 transition-colors duration-300 text-gray-800 dark:text-gray-200 flex h-screen overflow-hidden">
    <div id="sidebar-container" class="flex-shrink-0"></div>
    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        <div id="header-container"></div>
        <div class="flex-1 overflow-y-auto p-6 no-scrollbar">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700">
                    <p class="text-sm font-medium text-gray-500 dark:text-gray-400">Total de Produtos</p>
                    <p class="text-2xl font-bold text-gray-900 dark:text-white mt-2" id="totalProdutos">--</p>
                </div>
                <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700">
                    <p class="text-sm font-medium text-gray-500 dark:text-gray-400">Itens em Estoque Baixo</p>
                    <p class="text-2xl font-bold text-red-600 dark:text-red-400 mt-2" id="totalBaixoEstoque">--</p>
                </div>
                <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700">
                    <p class="text-sm font-medium text-gray-500 dark:text-gray-400">Valor Total em Estoque (Venda)</p>
                    <p class="text-2xl font-bold text-fluxfy-dark dark:text-fluxfy-yellow mt-2" id="valorTotalEstoque">R$ --</p>
                </div>
            </div>
            
            <div class="flex flex-col xl:flex-row justify-between items-start xl:items-center gap-4 mb-6">
                <input type="text" id="filtroProduto" placeholder="Pesquisar produto..." class="w-full xl:w-80 px-4 py-2 bg-white dark:bg-gray-800 text-gray-900 dark:text-white border border-gray-300 dark:border-gray-700 rounded-lg outline-none focus:ring-2 focus:ring-fluxfy-yellow">
                <div class="flex flex-wrap gap-2 w-full xl:w-auto">
                    <button onclick="imprimirRelatorioProdutos()" class="flex-1 xl:flex-none px-4 py-2.5 bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 font-bold rounded-lg hover:bg-gray-300 transition-colors" title="Lista de Produtos">
                        Catálogo PDF
                    </button>
                    <button onclick="imprimirRelatorioBalancete()" class="flex-1 xl:flex-none px-4 py-2.5 bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 font-bold rounded-lg hover:bg-gray-300 transition-colors" title="Balancete (Lucro/Prejuízo)">
                        Balancete PDF
                    </button>
                    <button onclick="abrirModalProduto()" class="flex-1 xl:flex-none px-5 py-2.5 bg-fluxfy-yellow hover:bg-fluxfy-dark text-fluxfy-black font-bold rounded-lg shadow transition-colors">
                        + Novo Produto
                    </button>
                </div>
            </div>
            
            <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-50 dark:bg-gray-900/50 text-gray-500 dark:text-gray-400 text-sm">
                                <th class="px-6 py-3 font-medium">Produto</th>
                                <th class="px-6 py-3 font-medium">Categoria</th>
                                <th class="px-6 py-3 font-medium">Quantidade</th>
                                <th class="px-6 py-3 font-medium">Custo (R$)</th>
                                <th class="px-6 py-3 font-medium">Venda (R$)</th>
                                <th class="px-6 py-3 font-medium">Status</th>
                                <th class="px-6 py-3 font-medium text-right">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaEstoque" class="divide-y divide-gray-200 dark:divide-gray-700">
                            <tr>
                                <td colspan="7" class="px-6 py-8 text-center text-gray-500 dark:text-gray-400">Carregando estoque...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
    
    <!-- Modal de Cadastro/Edição de Produto Novo -->
    <div id="modalProduto" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-xl max-w-md w-full p-6 border border-gray-200 dark:border-gray-700 max-h-[95vh] overflow-y-auto">
            <h3 id="modalTitulo" class="text-lg font-bold text-gray-800 dark:text-white mb-4">Novo Produto</h3>
            <form id="formProduto" class="space-y-4">
                <input type="hidden" id="produtoId">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Nome do Produto</label>
                    <input type="text" id="nomeProduto" required class="w-full px-3 py-2 bg-white dark:bg-gray-700 text-gray-900 dark:text-white border border-gray-300 dark:border-gray-600 rounded-lg outline-none focus:ring-2 focus:ring-fluxfy-yellow">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Categoria (Ativas)</label>
                    <select id="categoriaProduto" required class="w-full px-3 py-2 bg-white dark:bg-gray-700 text-gray-900 dark:text-white border border-gray-300 dark:border-gray-600 rounded-lg outline-none focus:ring-2 focus:ring-fluxfy-yellow">
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Imagem do Produto (Upload)</label>
                    <input type="file" id="imagemUploadProduto" accept="image/*" class="w-full px-3 py-2 bg-white dark:bg-gray-700 text-gray-900 dark:text-white border border-gray-300 dark:border-gray-600 rounded-lg outline-none focus:ring-2 focus:ring-fluxfy-yellow">
                    <input type="hidden" id="imagemBase64Produto">
                    <!-- Preview da imagem nova -->
                    <img id="previewNovoProduto" class="hidden mt-3 w-20 h-20 object-cover rounded-lg border border-gray-200 shadow-sm" alt="Preview">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Quantidade Inicial</label>
                    <input type="number" id="qtdProduto" min="0" required class="w-full px-3 py-2 bg-white dark:bg-gray-700 text-gray-900 dark:text-white border border-gray-300 dark:border-gray-600 rounded-lg outline-none focus:ring-2 focus:ring-fluxfy-yellow">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Custo de Compra (R$)</label>
                        <input type="number" step="0.01" min="0" id="custoProduto" required class="w-full px-3 py-2 bg-white dark:bg-gray-700 text-gray-900 dark:text-white border border-gray-300 dark:border-gray-600 rounded-lg outline-none focus:ring-2 focus:ring-fluxfy-yellow">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Preço de Venda (R$)</label>
                        <input type="number" step="0.01" min="0" id="precoProduto" required class="w-full px-3 py-2 bg-white dark:bg-gray-700 text-gray-900 dark:text-white border border-gray-300 dark:border-gray-600 rounded-lg outline-none focus:ring-2 focus:ring-fluxfy-yellow">
                    </div>
                </div>
                <div class="flex justify-end gap-3 mt-6">
                    <button type="button" onclick="fecharModalProduto()" class="px-4 py-2 bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 font-medium rounded-lg hover:bg-gray-300">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-fluxfy-yellow text-fluxfy-black font-bold rounded-lg hover:bg-fluxfy-dark">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal de Ajuste Rápido (Saldo, Categoria, Imagem, Custos) -->
    <div id="modalAjusteSaldo" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-xl max-w-md w-full p-6 border border-gray-200 dark:border-gray-700 max-h-[95vh] overflow-y-auto">
            <h3 class="text-lg font-bold text-gray-800 dark:text-white mb-4">Ajustar: <span id="ajusteProdutoNome" class="text-fluxfy-dark"></span></h3>
            <form id="formAjusteSaldo" class="space-y-4">
                <input type="hidden" id="ajusteProdutoId">
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Categoria</label>
                    <select id="ajusteCategoria" class="w-full px-3 py-2 bg-white dark:bg-gray-700 text-gray-900 dark:text-white border border-gray-300 dark:border-gray-600 rounded-lg outline-none focus:ring-2 focus:ring-fluxfy-yellow">
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Nova Imagem (Opcional)</label>
                    <input type="file" id="ajusteImagemUpload" accept="image/*" class="w-full px-3 py-2 bg-white dark:bg-gray-700 text-gray-900 dark:text-white border border-gray-300 dark:border-gray-600 rounded-lg outline-none focus:ring-2 focus:ring-fluxfy-yellow">
                    <input type="hidden" id="ajusteImagemBase64">
                    <!-- Preview da imagem existente/nova -->
                    <img id="previewAjusteProduto" class="hidden mt-3 w-20 h-20 object-cover rounded-lg border border-gray-200 shadow-sm" alt="Preview Atual">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Custo Atualizado</label>
                        <input type="number" step="0.01" min="0" id="ajusteCusto" required class="w-full px-3 py-2 bg-white dark:bg-gray-700 text-gray-900 dark:text-white border border-gray-300 dark:border-gray-600 rounded-lg outline-none focus:ring-2 focus:ring-fluxfy-yellow">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Venda Atualizada</label>
                        <input type="number" step="0.01" min="0" id="ajustePreco" required class="w-full px-3 py-2 bg-white dark:bg-gray-700 text-gray-900 dark:text-white border border-gray-300 dark:border-gray-600 rounded-lg outline-none focus:ring-2 focus:ring-fluxfy-yellow">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4 pt-2 border-t border-gray-100 dark:border-gray-700">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Tipo de Ajuste</label>
                        <select id="ajusteTipo" class="w-full px-3 py-2 bg-white dark:bg-gray-700 text-gray-900 dark:text-white border border-gray-300 dark:border-gray-600 rounded-lg outline-none focus:ring-2 focus:ring-fluxfy-yellow">
                            <option value="igualdade">Igualdade (=)</option>
                            <option value="adicao">Adição (+)</option>
                            <option value="subtracao">Subtração (-)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Quantidade / Saldo</label>
                        <input type="number" id="ajusteQtd" min="0" required class="w-full px-3 py-2 bg-white dark:bg-gray-700 text-gray-900 dark:text-white border border-gray-300 dark:border-gray-600 rounded-lg outline-none focus:ring-2 focus:ring-fluxfy-yellow">
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Histórico ou Observação</label>
                    <input type="text" id="ajusteObservacao" required class="w-full px-3 py-2 bg-white dark:bg-gray-700 text-gray-900 dark:text-white border border-gray-300 dark:border-gray-600 rounded-lg outline-none focus:ring-2 focus:ring-fluxfy-yellow">
                </div>

                <div class="flex justify-end gap-3 mt-6">
                    <button type="button" onclick="fecharModalAjuste()" class="px-4 py-2 bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 font-medium rounded-lg hover:bg-gray-300">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-fluxfy-yellow text-fluxfy-black font-bold rounded-lg hover:bg-fluxfy-dark">Aplicar Ajuste</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
