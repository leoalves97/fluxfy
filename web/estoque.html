<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluxfy - Gerenciamento de Estoque</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/icon/icon.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        fluxfy: {
                            yellow: '#F5C71A',
                            dark: '#D4A810',
                            black: '#111111'
                        }
                    }
                }
            }
        }
    </script>
    
    <link rel="stylesheet" href="style.css">
    <script src="theme.js" defer></script>
    <script src="estoque.js" defer></script>
    <script src="sidebar-loader.js" defer></script>
</head>
<body class="admin-body bg-gray-50 dark:bg-gray-900 transition-colors duration-300 text-gray-800 dark:text-gray-200">
    
    <!-- Sidebar (Menu Lateral injetado via script) -->
    <div id="sidebar-container" class="w-64 flex-shrink-0"></div>

    <!-- Área de Conteúdo Principal -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        <!-- Header -->
        <header class="h-16 flex-shrink-0 bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between px-6 transition-colors duration-300">
            <h1 class="text-xl font-bold text-gray-800 dark:text-white">Gerenciamento de Estoque</h1>
            
            <div class="flex items-center gap-4 relative">
                <!-- Botão Flutuante de Dark Mode -->
                <button id="theme-toggle" type="button" aria-label="Alternar tema" title="Alternar tema" class="text-gray-500 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-gray-700 focus:outline-none focus:ring-4 focus:ring-gray-200 dark:focus:ring-gray-700 rounded-lg text-sm p-2.5 transition-colors">
                    <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
                    <svg id="theme-toggle-light-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path></svg>
                </button>
                
                <!-- Ícone do Usuário e Dropdown -->
                <div class="relative">
                    <button id="userMenuBtn" class="h-8 w-8 rounded-full bg-fluxfy-yellow text-fluxfy-black flex items-center justify-center font-bold focus:outline-none hover:ring-2 hover:ring-offset-2 hover:ring-fluxfy-yellow transition-all cursor-pointer">
                        A
                    </button>
                    
                    <!-- Menu Dropdown -->
                    <div id="userDropdown" class="dropdown-menu bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700">
                        <ul class="py-1 text-sm text-gray-700 dark:text-gray-200">
                            <li><a href="#" class="block px-4 py-2 hover:bg-gray-100 dark:hover:bg-gray-700">Meu Perfil</a></li>
                            <li><a href="#" class="block px-4 py-2 hover:bg-gray-100 dark:hover:bg-gray-700">Configurações</a></li>
                            <li class="border-t border-gray-200 dark:border-gray-700"></li>
                            <li><button id="btnLogout" class="w-full text-left block px-4 py-2 text-red-600 dark:text-red-400 hover:bg-gray-100 dark:hover:bg-gray-700">Sair do Sistema</button></li>
                        </ul>
                    </div>
                </div>
            </div>
        </header>

        <!-- Conteúdo Rolável -->
        <div class="flex-1 overflow-y-auto p-6 no-scrollbar">
            
            <!-- Cards de Resumo -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700">
                    <p class="text-sm font-medium text-gray-500 dark:text-gray-400">Total de Produtos</p>
                    <p class="text-2xl font-bold text-gray-900 dark:text-white mt-2" id="totalProdutos">--</p>
                </div>
                <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700">
                    <p class="text-sm font-medium text-gray-500 dark:text-gray-400">Itens em Estoque Baixo</p>
                    <p class="text-2xl font-bold text-red-600 dark:text-red-400 mt-2" id="totalBaixoEstoque">--</p>
                </div>
                <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700">
                    <p class="text-sm font-medium text-gray-500 dark:text-gray-400">Valor Total em Estoque</p>
                    <p class="text-2xl font-bold text-fluxfy-dark dark:text-fluxfy-yellow mt-2" id="valorTotalEstoque">R$ --</p>
                </div>
            </div>

            <!-- Barra de Ações (Adicionar e Buscar) -->
            <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-6">
                <input type="text" id="filtroProduto" placeholder="Pesquisar produto..." 
                    class="w-full md:w-80 px-4 py-2 bg-white dark:bg-gray-800 text-gray-900 dark:text-white border border-gray-300 dark:border-gray-700 rounded-lg outline-none focus:ring-2 focus:ring-fluxfy-yellow">
                <button onclick="abrirModalProduto()" class="w-full md:w-auto px-5 py-2.5 bg-fluxfy-yellow hover:bg-fluxfy-dark text-fluxfy-black font-bold rounded-lg shadow transition-colors">
                    + Adicionar Produto
                </button>
            </div>

            <!-- Tabela de Estoque -->
            <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-50 dark:bg-gray-900/50 text-gray-500 dark:text-gray-400 text-sm">
                                <th class="px-6 py-3 font-medium">Produto</th>
                                <th class="px-6 py-3 font-medium">Categoria</th>
                                <th class="px-6 py-3 font-medium">Quantidade</th>
                                <th class="px-6 py-3 font-medium">Preço (R$)</th>
                                <th class="px-6 py-3 font-medium">Status</th>
                                <th class="px-6 py-3 font-medium text-right">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaEstoque" class="divide-y divide-gray-200 dark:divide-gray-700">
                            <tr>
                                <td colspan="6" class="px-6 py-8 text-center text-gray-500 dark:text-gray-400">
                                    Carregando estoque...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <!-- Modal Simples de Cadastro/Edição -->
    <div id="modalProduto" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-xl max-w-md w-full p-6 border border-gray-200 dark:border-gray-700">
            <h3 id="modalTitulo" class="text-lg font-bold text-gray-800 dark:text-white mb-4">Novo Produto</h3>
            <form id="formProduto" class="space-y-4">
                <input type="hidden" id="produtoId">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Nome do Produto</label>
                    <input type="text" id="nomeProduto" required class="w-full px-3 py-2 bg-white dark:bg-gray-700 text-gray-900 dark:text-white border border-gray-300 dark:border-gray-600 rounded-lg outline-none focus:ring-2 focus:ring-fluxfy-yellow">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Categoria</label>
                    <input type="text" id="categoriaProduto" required class="w-full px-3 py-2 bg-white dark:bg-gray-700 text-gray-900 dark:text-white border border-gray-300 dark:border-gray-600 rounded-lg outline-none focus:ring-2 focus:ring-fluxfy-yellow">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Quantidade</label>
                        <input type="number" id="qtdProduto" min="0" required class="w-full px-3 py-2 bg-white dark:bg-gray-700 text-gray-900 dark:text-white border border-gray-300 dark:border-gray-600 rounded-lg outline-none focus:ring-2 focus:ring-fluxfy-yellow">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Preço (R$)</label>
                        <input type="number" step="0.01" min="0" id="precoProduto" required class="w-full px-3 py-2 bg-white dark:bg-gray-700 text-gray-900 dark:text-white border border-gray-300 dark:border-gray-600 rounded-lg outline-none focus:ring-2 focus:ring-fluxfy-yellow">
                    </div>
                </div>
                <div class="flex justify-end gap-3 mt-6">
                    <button type="button" onclick="fecharModalProduto()" class="px-4 py-2 bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 font-medium rounded-lg hover:bg-gray-300">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-fluxfy-yellow text-fluxfy-black font-bold rounded-lg hover:bg-fluxfy-dark">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
